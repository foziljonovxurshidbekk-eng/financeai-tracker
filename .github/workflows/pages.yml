# Saytni (public/) gh-pages branch'iga joylaydi — GitHub Pages shu branch'dan ko'rsatadi.
# API — Supabase Edge Function'da (public/config.js).
name: Sayt (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["public/**", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Saytni yig'ish
        run: |
          mkdir -p _site/vendor/chart.js
          cp -r public/* _site/
          cp node_modules/chart.js/dist/chart.umd.min.js _site/vendor/chart.js/
          touch _site/.nojekyll
          # Brauzer keshi eski fayllarni ko'rsatmasligi uchun versiya qo'shamiz
          v="${GITHUB_SHA::7}"
          sed -i -e "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" -e "s|src=\"config.js\"|src=\"config.js?v=$v\"|" -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
      - name: gh-pages branch'iga joylash
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sayt: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
